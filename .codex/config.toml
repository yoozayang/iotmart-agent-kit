[mcp_servers."Salesforce DX"]
command = "npx"
args = ["-y", "@salesforce/mcp", "--toolsets", "orgs,data", "--no-telemetry"]

[mcp_servers."Salesforce DX".env]
SF_TARGET_ORG = "ccdev01"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.notion]
# Use an environment variable for the Notion API key rather than embedding it here.
# Set NOTION_API_KEY in your shell environment before running Codex.
url = "https://mcp.notion.com/mcp"
bearer_token_env_var = "NOTION_API_KEY"
http_headers = { "Notion-Version" = "2025-09-03" }
