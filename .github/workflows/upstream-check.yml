name: Upstream check

# Weekly update of the official sf-skills, applied without manual review:
# - updates are committed through a pull request that is merged automatically
# - safety does not rely on reading skill text: bin/sf, Codex rules and Claude permissions
#   enforce the hard constraints at execution time
# - the only gate is structural: changes must stay inside official skills, the lock file and notices;
#   otherwise the job fails (GitHub notifies by email) and nothing is merged
# Personal tools (caveman, Ponytail) are updated locally by scripts/autoupdate.sh.
on:
  schedule:
    - cron: "0 1 * * 1" # Monday 01:00 UTC (09:00 Taipei)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # label creation

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  sf-skills:
    name: Official sf-skills update PR
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update project skills from skills-lock.json
        run: CI=true npx -y skills update -p -y < /dev/null

      - name: Keep only official skill changes
        run: |
          # The CLI may add per-agent links (e.g. .claude/skills); the kit mounts .agents/skills instead.
          rm -rf .claude/skills
          git checkout -- .claude 2>/dev/null || true
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^(\.agents/skills/platform-|skills-lock\.json$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes outside official skills:"; echo "$unexpected"; exit 1
          fi

      - name: Build PR body
        id: body
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          head="$(gh api repos/forcedotcom/sf-skills/commits/main --jq '.sha[0:7] + "," + .commit.committer.date[0:10]')"
          sed -i -E "s/commit \`[0-9a-f]{7}\`,[0-9]{4}-[0-9]{2}-[0-9]{2}/commit \`${head%%,*}\`,${head#*,}/" THIRD_PARTY_NOTICES.md
          {
            echo "上游 [forcedotcom/sf-skills](https://github.com/forcedotcom/sf-skills) 有更新,上游最新commit \`${head%%,*}\`(${head#*,})"
            echo
            echo "### 變更檔案"
            echo '```'
            git add -A .agents/skills skills-lock.json THIRD_PARTY_NOTICES.md
            git diff --cached --stat -- . ':(exclude)*.json' | tail -40
            echo "JSON資產變更檔數: $(git diff --cached --name-only -- '*.json' | wc -l)"
            echo '```'
            echo
            bash scripts/upstream/scan-risk.sh HEAD
            echo
            echo "### overlay引用檢查"
            missing="$(grep -oE '\.agents/skills/platform-[^\`]+' .codex/playbooks/sf-skills-overlay.md | sort -u | while read -r f; do [ -e "$f" ] || echo "- \`$f\`"; done)"
            if [ -n "$missing" ]; then echo "overlay引用的下列路徑已不存在,需更新overlay:"; echo "$missing"; else echo "overlay引用的路徑皆存在"; fi
            echo
            echo "此PR由workflow自動合併;執行層防護(bin/sf,Codex rules,Claude permissions)不受skill內容影響"
          } > "$RUNNER_TEMP/pr-body.md"
          git reset -q

      - name: Ensure label
        if: steps.body.outputs.changed == 'true'
        run: gh label create upstream-update --color 0E8A16 --description "Automated upstream skill update" --force

      - name: Open or update pull request
        id: cpr
        if: steps.body.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream/sf-skills
          delete-branch: true
          title: "chore:更新官方sf-skills"
          commit-message: |
            docs:更新官方sf-skills

            由upstream-check workflow自動產生,合併前需對照sf-skills-overlay.md審查
          body-path: ${{ runner.temp }}/pr-body.md
          labels: upstream-update
          add-paths: |
            .agents/skills
            skills-lock.json
            THIRD_PARTY_NOTICES.md

      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch \
            --subject "docs:更新官方sf-skills" \
            --body "由upstream-check workflow自動更新並合併"
